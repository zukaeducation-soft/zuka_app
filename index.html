    // Aplica el tema guardado antes de pintar, para evitar un parpadeo.

  <script>
    (function () {
      var t = document.getElementById('fuentes');
      var lista = [].map.call(t.content.querySelectorAll('script'), function (s) {
        return { src: s.getAttribute('src'), huella: s.getAttribute('integrity') };
      });
      if (window.zukaPaquetes) {
        lista = lista.filter(function (d) { return d.huella; })
          .concat(window.zukaPaquetes.map(function (src) { return { src: src }; }));
      }
      // Si un archivo propio no llega, la app no puede armarse: se dice y se ofrece reintentar (no una pantalla vacía).
      var avisado = false;
      function falla() {
        if (avisado) return;
        avisado = true;
        window.zukaSinCargar = true;
        var d = document.createElement('div'), b = document.createElement('button');
        d.id = 'sin-cargar';
        d.setAttribute('role', 'alert');
        d.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:2000;display:grid;place-content:center;gap:16px;padding:24px;text-align:center;background:#07080f;color:#e8ecf6;font:16px/1.4 system-ui,sans-serif';
        d.textContent = 'No se pudo cargar Zuka. Revisa tu conexión.';
        b.textContent = 'Reintentar';
        b.style.cssText = 'justify-self:center;padding:12px 22px;border:1px solid #6fd3ff;border-radius:12px;background:transparent;color:#6fd3ff;font:inherit;cursor:pointer';
        b.addEventListener('click', function () { location.reload(); });
        d.appendChild(b);
        document.body.appendChild(d);
      }
      lista.forEach(function (d) {
        var s = document.createElement('script');
        s.async = false;   // se ejecutan en el orden de la lista
        if (d.huella) { s.integrity = d.huella; s.crossOrigin = 'anonymous'; } else { s.onerror = falla; }
        s.src = d.src;
        document.head.appendChild(s);
      });
    })();
