  <script>
    // Aplica el tema guardado antes de pintar, para evitar un parpadeo.
    (function () {
      var t = 'system';
      try { t = (JSON.parse(localStorage.getItem('zuka-v1')) || {}).theme || 'system'; } catch (e) {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      // Arranque rápido. Publicada, la app carga sus scripts en paquetes (ver la plantilla «fuentes» al final): los del
      // arranque se piden desde ya, sin esperar a las hojas de estilo; los juegos de cada curso, al abrir una lección
      // (js/carga.js). En localhost van sueltos («?paquetes» prueba lo publicado).
      // La letra de Google se pide sin frenar el primer pintado: si Google tarda o falla, la app abre igual.
      var suelto = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && !/[?&]paquetes([&=]|$)/.test(location.search);
      window.zukaPaquetes = suelto ? null : (window.ZUKA_PAQUETES || {}).arranque || [];
      function enlace(rel, href, as) {
        var l = document.createElement('link');
        l.rel = rel; if (as) l.as = as; l.href = href;
        document.head.appendChild(l);
      }
      enlace('stylesheet', 'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Jost:wght@400;500;600;700&display=swap');
      (window.zukaPaquetes || []).forEach(function (f) { enlace('preload', f, 'script'); });
    })();
  </script>

  <script>
    (function () {
      var t = document.getElementById('fuentes');
      var lista = [].map.call(t.content.querySelectorAll('script'), function (s) {
        return { src: s.getAttribute('src'), huella: s.getAttribute('integrity') };
      });
      if (window.zukaPaquetes) {
        lista = lista.filter(function (d) { return d.huella; })
          .concat(window.zukaPaquetes.map(function (src) { return { src: src }; }));
      }
      // Si un archivo propio no llega, la app no puede armarse: se dice y se ofrece reintentar (no una pantalla vacía).
      var avisado = false;
      function falla() {
        if (avisado) return;
        avisado = true;
        window.zukaSinCargar = true;
        var d = document.createElement('div'), b = document.createElement('button');
        d.id = 'sin-cargar';
        d.setAttribute('role', 'alert');
        d.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:2000;display:grid;place-content:center;gap:16px;padding:24px;text-align:center;background:#07080f;color:#e8ecf6;font:16px/1.4 system-ui,sans-serif';
        d.textContent = 'No se pudo cargar Zuka. Revisa tu conexión.';
        b.textContent = 'Reintentar';
        b.style.cssText = 'justify-self:center;padding:12px 22px;border:1px solid #6fd3ff;border-radius:12px;background:transparent;color:#6fd3ff;font:inherit;cursor:pointer';
        b.addEventListener('click', function () { location.reload(); });
        d.appendChild(b);
        document.body.appendChild(d);
      }
      // Sin la lista de paquetes (js/paquetes/lista.js no llegó) no hay app que armar.
      if (window.zukaPaquetes && !window.zukaPaquetes.length) falla();
      lista.forEach(function (d) {
        var s = document.createElement('script');
        s.async = false;   // se ejecutan en el orden de la lista
        if (d.huella) { s.integrity = d.huella; s.crossOrigin = 'anonymous'; } else { s.onerror = falla; }
        s.src = d.src;
        document.head.appendChild(s);
      });
    })();
  </script>
